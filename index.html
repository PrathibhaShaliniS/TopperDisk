<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TopperDisk – Login / Register</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0b3a6e; --blue:#0a7ad0; --teal:#3fb3b3; --ink:#1c2b3a; --line:#d5e3ea; --bg:#f3f8fa; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; padding:32px 20px; background:var(--bg); font-family:"Poppins",system-ui,sans-serif; color:var(--ink); }
  .logo { width:min(220px,60vw); height:auto; border-radius:50%; }
  .box { width:min(380px,100%); display:grid; gap:14px; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; background:#e4eef3; border-radius:12px; padding:4px; }
  .tab { padding:10px 8px; border:0; border-radius:9px; background:none; font:500 14px "Poppins",sans-serif; color:#47606f; cursor:pointer; }
  .tab[aria-selected="true"] { background:#fff; color:var(--navy); box-shadow:0 1px 6px rgba(11,58,110,.15); }
  .hint { font-size:13px; color:#5d7080; text-align:center; }
  form { display:grid; gap:14px; }
  [hidden] { display:none !important; }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:13px 16px;
    border-radius:10px; font:500 15px "Poppins",sans-serif; cursor:pointer; }
  .btn-google { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  .btn-google:hover { border-color:var(--teal); }
  .btn-primary { background:var(--navy); color:#fff; border:1.5px solid var(--navy); }
  .btn-primary:hover { background:var(--blue); border-color:var(--blue); }
  .or { display:flex; align-items:center; gap:12px; font-size:13px; color:#6b7f8c; }
  .or::before,.or::after { content:""; flex:1; height:1px; background:var(--line); }
  label { display:grid; gap:6px; font-size:14px; font-weight:500; }
  input,select { width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); background:#fff;
    font:400 15px "Poppins",sans-serif; color:var(--ink); }
  .pw { position:relative; }
  .pw input { padding-right:64px; }
  .pw button { position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:none;
    color:var(--blue); font:500 13px "Poppins",sans-serif; cursor:pointer; padding:6px; }
  .forgot { justify-self:end; font-size:13px; color:var(--blue); text-decoration:none; }
  .msg { min-height:20px; font-size:13px; color:#b3261e; text-align:center; }
  .msg.ok { color:#1a9b55; }
  :focus-visible { outline:3px solid var(--teal); outline-offset:2px; }
</style>
</head>
<body>

  <img class="logo" src="logo.jpg" alt="TopperDisk logo">

  <main class="box">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabLogin" aria-selected="true" aria-controls="loginPanel">Student Login</button>
      <button class="tab" role="tab" id="tabReg" aria-selected="false" aria-controls="regPanel">Mentor Register</button>
    </div>

    <!-- STUDENT (ASPIRANT) LOGIN -->
    <section id="loginPanel" role="tabpanel" aria-labelledby="tabLogin">
      <form id="loginForm" novalidate>
        <p class="hint">Aspirants: log in to find verified mentors.</p>
        <button class="btn btn-google" id="googleBtn" type="button">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.5 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.7 6.9l7.3 5.7c4.3-4 7.1-9.9 7.1-17.1z"/>
            <path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.7 2.3-8.6 2.3-6.3 0-11.6-4-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
          Continue with Gmail
        </button>
        <div class="or">or use your User ID</div>
        <label>User ID
          <input id="userId" type="text" autocomplete="username" placeholder="Enter your User ID" required>
        </label>
        <label>Password
          <span class="pw">
            <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" class="toggle" data-target="password" aria-label="Show password">Show</button>
          </span>
        </label>
        <a class="forgot" href="#">Forgot password?</a>
        <button class="btn btn-primary" type="submit">Login</button>
        <p class="msg" id="loginMsg" role="alert"></p>
      </form>
    </section>

    <!-- MENTOR REGISTRATION -->
    <section id="regPanel" role="tabpanel" aria-labelledby="tabReg" hidden>
      <form id="regForm" novalidate>
        <p class="hint">Mentors: create an account, then verify your rank card.</p>
        <label>Full name
          <input id="rName" type="text" autocomplete="name" placeholder="Your full name" required>
        </label>
        <label>Email
          <input id="rEmail" type="email" autocomplete="email" placeholder="you@gmail.com" required>
        </label>
        <label>User ID
          <input id="rUser" type="text" autocomplete="username" placeholder="Choose a User ID" required>
        </label>
        <label>Exam you cleared
          <input id="rExam" type="text" placeholder="e.g. JEE Advanced, NEET, UPSC" required>
        </label>
        <label>Password
          <span class="pw">
            <input id="rPass" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
            <button type="button" class="toggle" data-target="rPass" aria-label="Show password">Show</button>
          </span>
        </label>
        <label>Confirm password
          <input id="rPass2" type="password" autocomplete="new-password" placeholder="Re-enter password" required>
        </label>
        <button class="btn btn-primary" type="submit">Create Mentor Account</button>
        <p class="msg" id="regMsg" role="alert"></p>
      </form>
    </section>
  </main>

<script>
  const $ = (id) => document.getElementById(id);

  // Tabs
  function showTab(reg) {
    $('tabLogin').setAttribute('aria-selected', !reg);
    $('tabReg').setAttribute('aria-selected', reg);
    $('loginPanel').hidden = reg;
    $('regPanel').hidden = !reg;
    history.replaceState(null, '', reg ? '#register' : '#login');
  }
  $('tabLogin').onclick = () => showTab(false);
  $('tabReg').onclick = () => showTab(true);
  showTab(location.hash === '#register');

  // Show / hide password
  document.querySelectorAll('.toggle').forEach((b) => b.addEventListener('click', () => {
    const input = $(b.dataset.target), show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    b.textContent = show ? 'Hide' : 'Show';
    b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  }));

  // Student login
  $('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const msg = $('loginMsg'), userId = $('userId').value.trim();
    msg.className = 'msg';
    if (!userId || !$('password').value) { msg.textContent = 'Enter your User ID and password to log in.'; return; }
    msg.textContent = '';
    // TODO: send { userId, password, role: 'aspirant' } to your backend login API, then redirect to the student dashboard
    console.log('Student login attempt:', userId);
  });

  $('googleBtn').addEventListener('click', () => {
    // TODO: start Google Sign-In here (Firebase signInWithPopup or Google Identity Services), role: 'aspirant'
    console.log('Google sign-in clicked');
  });

  // Mentor registration
  $('regForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const msg = $('regMsg');
    msg.className = 'msg';
    const data = { name: $('rName').value.trim(), email: $('rEmail').value.trim(), userId: $('rUser').value.trim(),
                   exam: $('rExam').value.trim(), password: $('rPass').value };
    if (!data.name || !data.email || !data.userId || !data.exam || !data.password) { msg.textContent = 'Please fill in every field.'; return; }
    if (!/^\S+@\S+\.\S+$/.test(data.email)) { msg.textContent = 'Enter a valid email address.'; return; }
    if (data.password.length < 8) { msg.textContent = 'Password must be at least 8 characters.'; return; }
    if (data.password !== $('rPass2').value) { msg.textContent = 'Passwords do not match.'; return; }
    msg.className = 'msg ok';
    msg.textContent = 'Mentor account created (demo). Next: verify your rank card.';
    // TODO: send { ...data, role: 'mentor' } to your backend register API, then redirect to the rank-card upload page
    console.log('Mentor registration:', { ...data, password: undefined, role: 'mentor' });
  });
</script>
</body>
</html>
